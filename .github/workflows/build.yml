name: build-memread

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 形态一：命令行二进制（NewTerm + sudo 使用）
  binary:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile CLI for iOS arm64
        run: |
          set -e
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK = $SDK"
          xcrun --sdk iphoneos clang \
            -arch arm64 \
            -O2 \
            -isysroot "$SDK" \
            -miphoneos-version-min=15.0 \
            -o memread memread.c memread_core.c
          file memread
          ls -l memread

      - name: Ad-hoc sign (best effort)
        run: |
          codesign -s - --entitlements ent.plist -f memread || echo "ad-hoc 签名失败，在设备上用 ldid 重签即可"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: memread-arm64
          path: |
            memread
            ent.plist
          if-no-files-found: error

  # 形态二：UI App（.ipa），列表选择 App、自动找 PID、一键读取
  ipa:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile UI app
        run: |
          set -e
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK = $SDK"
          rm -rf build
          mkdir -p build/Payload/memread.app
          xcrun --sdk iphoneos clang \
            -arch arm64 \
            -fobjc-arc \
            -O2 \
            -isysroot "$SDK" \
            -miphoneos-version-min=15.0 \
            -I . \
            -framework UIKit -framework Foundation \
            -o build/Payload/memread.app/memread \
            app/main.m app/AppDelegate.m app/ViewController.m app/DetailViewController.m memread_core.c
          file build/Payload/memread.app/memread
          cp app/Info.plist build/Payload/memread.app/Info.plist
          cp ent.plist build/ent.plist

      - name: Codesign app bundle with entitlements
        run: |
          set -e
          plutil -convert binary1 build/Payload/memread.app/Info.plist
          codesign --force --sign - --timestamp=none \
            --entitlements ent.plist \
            build/Payload/memread.app
          echo "=== verify ==="
          codesign -dvvv build/Payload/memread.app || true
          echo "=== entitlements ==="
          codesign -d --entitlements :- build/Payload/memread.app || true

      - name: Package ipa
        run: |
          cd build
          zip -qr memread.ipa Payload
          ls -l memread.ipa

      - name: Upload ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: memread-ipa
          path: |
            build/memread.ipa
            build/ent.plist
          if-no-files-found: error

      # 固定 tag 的 release：设备侧 update.sh 直接从这里拉最新 ipa
      - name: Publish latest release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: MemRead latest
          prerelease: true
          files: build/memread.ipa
