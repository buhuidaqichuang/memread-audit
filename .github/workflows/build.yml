name: build-memread

on:
  push:
  workflow_dispatch:

jobs:
  # 形态一：命令行二进制（推荐，配合 NewTerm + sudo 使用）
  binary:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile for iOS arm64
        run: |
          set -e
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK = $SDK"
          xcrun --sdk iphoneos clang \
            -arch arm64 \
            -O2 \
            -isysroot "$SDK" \
            -miphoneos-version-min=15.0 \
            -o memread memread.c
          file memread
          ls -l memread

      - name: Ad-hoc sign (best effort)
        run: |
          codesign -s - --entitlements ent.plist -f memread || echo "ad-hoc 签名失败，在设备上用 ldid 重签即可"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: memread-arm64
          path: |
            memread
            ent.plist
          if-no-files-found: error

  # 形态二：打包成 .ipa（需要 ldid 重签才能拿到 platform-application）
  ipa:
    needs: binary
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: memread-arm64
          path: dist

      - name: Package Payload
        run: |
          set -e
          rm -rf build
          mkdir -p build/Payload/memread.app
          cp dist/memread build/Payload/memread.app/memread
          chmod 755 build/Payload/memread.app/memread
          cp app/Info.plist build/Payload/memread.app/Info.plist
          cp dist/ent.plist build/ent.plist
          cd build
          zip -qr memread.ipa Payload
          ls -l memread.ipa

      - name: Upload ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: memread-ipa
          path: |
            build/memread.ipa
            build/ent.plist
          if-no-files-found: error
