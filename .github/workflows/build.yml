name: build-memread

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile for iOS arm64
        run: |
          set -e
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK = $SDK"
          xcrun --sdk iphoneos clang \
            -arch arm64 \
            -O2 \
            -isysroot "$SDK" \
            -miphoneos-version-min=15.0 \
            -o memread memread.c
          file memread
          ls -l memread

      - name: Ad-hoc sign with entitlements (best effort)
        run: |
          codesign -s - --entitlements ent.plist -f memread || echo "codesign 失败，可在设备上用 ldid 重新签名"
          codesign -d --entitlements - memread || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: memread-arm64
          path: |
            memread
            ent.plist
          if-no-files-found: error
