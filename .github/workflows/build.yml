name: build-memread

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 形态一：命令行二进制（NewTerm + sudo 使用）
  binary:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile CLI for iOS arm64
        run: |
          set -e
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK = $SDK"
          xcrun --sdk iphoneos clang \
            -arch arm64 \
            -O2 \
            -isysroot "$SDK" \
            -miphoneos-version-min=15.0 \
            -o memread memread.c memread_core.c
          xcrun --sdk iphoneos clang \
            -arch arm64 \
            -O2 \
            -isysroot "$SDK" \
            -miphoneos-version-min=15.0 \
            -o udpsniff udpsniff.c
          file memread udpsniff
          ls -l memread udpsniff

      - name: Ad-hoc sign (best effort)
        run: |
          codesign -s - --entitlements ent.plist -f memread || echo "ad-hoc 签名失败，在设备上用 ldid 重签即可"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: memread-arm64
          path: |
            memread
            udpsniff
            ent.plist
          if-no-files-found: error

  # 形态二：UI App（.ipa），列表选择 App、自动找 PID、一键读取
  ipa:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile UI app
        run: |
          set -e
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK = $SDK"
          rm -rf build
          mkdir -p build/Payload/memread.app
          xcrun --sdk iphoneos clang \
            -arch arm64 \
            -fobjc-arc \
            -O2 \
            -isysroot "$SDK" \
            -miphoneos-version-min=15.0 \
            -I . \
            -framework UIKit -framework Foundation -framework Metal -framework OpenGLES \
            -framework AVKit -framework AVFoundation -framework CoreMedia -framework CoreVideo -framework QuartzCore -framework CoreGraphics -framework AudioToolbox \
            -o build/Payload/memread.app/memread \
            app/main.m app/AppDelegate.m app/ViewController.m app/DetailViewController.m app/FilesViewController.m app/DumpViewController.m app/FileTextViewController.m app/MemFileSearch.m app/SearchResultsViewController.m app/ValueScanViewController.m app/ValueListViewController.m app/SavedAddressStore.m app/SavedViewController.m app/FloatPanelController.m memread_core.c
          file build/Payload/memread.app/memread
          cp app/Info.plist build/Payload/memread.app/Info.plist
          cp ent.plist build/ent.plist
          # 生成各尺寸图标（源图 1024），同时给一套越狱 App 认的传统 Icon*.png
          for spec in "AppIcon60x60@2x.png 120" "AppIcon60x60@3x.png 180" "AppIcon76x76@2x~ipad.png 152" "AppIcon83.5x83.5@2x~ipad.png 167" "AppIcon1024.png 1024" \
                      "Icon.png 57" "Icon@2x.png 114" "Icon-72.png 72" "Icon-72@2x.png 144" \
                      "Icon-76.png 76" "Icon-76@2x.png 152" "Icon-60@2x.png 120" "Icon-60@3x.png 180" "Icon-83.5@2x.png 167"; do
            set -- $spec
            sips -z "$2" "$2" app/AppIcon1024.png --out "build/Payload/memread.app/$1" >/dev/null
          done
          # 生成 Assets.car（iOS 17 桌面图标走 asset catalog）
          mkdir -p app/Assets.xcassets/AppIcon.appiconset
          sips -z 1024 1024 app/AppIcon1024.png --out app/Assets.xcassets/AppIcon.appiconset/AppIcon1024.png >/dev/null
          xcrun actool app/Assets.xcassets \
            --compile build/Payload/memread.app \
            --platform iphoneos \
            --minimum-deployment-target 15.0 \
            --app-icon AppIcon \
            --output-partial-info-plist build/icon-partial.plist
          ls -l build/Payload/memread.app

      - name: Codesign app bundle with entitlements
        run: |
          set -e
          plutil -convert binary1 build/Payload/memread.app/Info.plist
          codesign --force --sign - --timestamp=none \
            --entitlements ent.plist \
            build/Payload/memread.app
          echo "=== verify ==="
          codesign -dvvv build/Payload/memread.app || true
          echo "=== entitlements ==="
          codesign -d --entitlements :- build/Payload/memread.app || true

      - name: Package ipa
        run: |
          cd build
          zip -qr memread.ipa Payload
          ls -l memread.ipa

      - name: Upload ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: memread-ipa
          path: |
            build/memread.ipa
            build/ent.plist
          if-no-files-found: error

      # 固定 tag 的 release：设备侧 update.sh 直接从这里拉最新 ipa
      - name: Publish latest release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: MemRead latest
          prerelease: true
          files: build/memread.ipa

  # 形态三：SpringBoard 悬浮窗（ElleKit tweak）
  float:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile floating panel dylib
        run: |
          set -e
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          mkdir -p build/float
          xcrun --sdk iphoneos clang \
            -arch arm64 \
            -O2 \
            -fobjc-arc \
            -isysroot "$SDK" \
            -miphoneos-version-min=15.0 \
            -dynamiclib \
            -framework UIKit -framework Foundation \
            -o build/float/MemReadFloat.dylib \
            float/MemReadFloat.m
          cp float/MemReadFloat.plist build/float/
          file build/float/MemReadFloat.dylib
          ls -l build/float

      - name: Ad-hoc sign
        run: |
          codesign -s - -f build/float/MemReadFloat.dylib || echo "sign skipped"

      - name: Package
        run: |
          cd build
          zip -qr MemReadFloat.zip float
          ls -l MemReadFloat.zip

      - name: Upload float artifact
        uses: actions/upload-artifact@v4
        with:
          name: memread-float
          path: build/MemReadFloat.zip
          if-no-files-found: error

      - name: Publish float asset
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          prerelease: true
          files: build/MemReadFloat.zip
